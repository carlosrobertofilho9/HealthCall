appId: com.healthcall.app
productName: HealthCall
copyright: Copyright © 2026
directories:
  output: dist-electron
  buildResources: build

publish:
  provider: github
  owner: carlosrobertofilho9
  repo: healthcall

files:
  - dist/**/*
  - electron/**/*
  - package.json

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: HealthCall-Setup-${version}.exe

mac:
  target: dmg
  icon: public/healthcall-icon.png
  artifactName: HealthCall-${version}.dmg

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HealthCall
  displayLanguageSelector: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico