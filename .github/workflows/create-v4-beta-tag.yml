name: Publish HealthCall v4 Beta Tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-v4-beta.marker'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish v4.0.0-beta.1 tag
        shell: bash
        run: |
          set -euo pipefail
          TAG='v4.0.0-beta.1'
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m 'HealthCall v4.0.0-beta.1 — Local First Beta'
          git push origin "$TAG"
