name: Local-first CI

on:
  push:
    branches:
      - main
      - feat/local-first-open-source
  pull_request:

permissions:
  contents: read

jobs:
  local-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test local server
        run: npm run test:local

      - name: Build local-first web app
        env:
          VITE_DATA_MODE: local
        run: npm run build
