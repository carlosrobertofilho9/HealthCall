<!DOCTYPE html>
<html>
	<head>
		<title>HealthCall Display</title>
		<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
		<style>
			/* Estilos básicos e reset */
			body,
			html {
				height: 100%;
				margin: 0;
				padding: 0;
				font-family: 'Spline Sans', 'Noto Sans', sans-serif;
				background-color: #111827;
				color: white;
				overflow: hidden;
			}
			.material-symbols-outlined {
				font-family: 'Material Symbols Outlined';
				font-weight: normal;
				font-style: normal;
				font-size: 24px;
				line-height: 1;
				letter-spacing: normal;
				text-transform: none;
				display: inline-block;
				white-space: nowrap;
				word-wrap: normal;
				direction: ltr;
				-webkit-font-feature-settings: 'liga';
				-webkit-font-smoothing: antialiased;
			}
			@import url('https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;700;900&display=swap');
			@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200');

			/* Layout principal */
			.container {
				display: flex;
				flex-direction: column;
				min-height: 100vh;
				width: 100%;
			}
			header {
				padding: 1rem 1.5rem;
				display: flex;
				align-items: center;
				justify-content: space-between;
				border-bottom: 1px solid #374151;
			}
			header .logo {
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}
			header .logo svg {
				color: #38e07b;
				width: 24px;
				height: 24px;
			}
			header h1 {
				font-size: 1.25rem;
				font-weight: bold;
				margin: 0;
			}
			main {
				flex-grow: 1;
				padding: 1.5rem;
				display: flex;
				flex-direction: column;
				width: calc(100% - 3rem);
			}
			.content-grid {
				display: grid;
				grid-template-columns: 1fr;
				gap: 1.5rem;
				flex-grow: 1;
			}
			@media (min-width: 768px) {
				.content-grid {
					grid-template-columns: 2fr 1fr;
				}
			}

			/* Card de Chamada Principal */
			.main-call-card {
				background-color: #1f2937;
				border-radius: 1rem;
				padding: 2rem;
				text-align: center;
				display: flex;
				flex-direction: column;
				justify-content: center;
			}
			.main-call-card .status {
				font-size: 2.5rem;
				font-weight: bold;
				color: #38e07b;
				margin-bottom: 1rem;
			}
			.main-call-card .patient-name {
				font-size: 4rem;
				font-weight: 900;
				margin-bottom: 1.5rem;
			}
			.main-call-card .destination {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				background-color: #374151;
				border-radius: 9999px;
				padding: 1rem 2rem;
				margin: 0 auto;
			}
			.main-call-card .destination .icon {
				font-size: 3rem;
				color: #38e07b;
			}
			.main-call-card .destination .room {
				font-size: 3rem;
				font-weight: bold;
			}

			/* Histórico e Próximos */
			.sidebar,
			.next-patients-section {
				background-color: #1f2937;
				border-radius: 1rem;
				padding: 1.5rem;
				display: flex;
				flex-direction: column;
			}
			.sidebar h3,
			.next-patients-section h3 {
				font-size: 1.25rem;
				font-weight: bold;
				margin: 0 0 1rem 0;
			}
			.history-list {
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
				flex-grow: 1;
			}
			.history-item {
				padding: 1rem;
				border-radius: 0.5rem;
				background-color: #4b5563;
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.history-item.current {
				background-color: rgba(22, 163, 74, 0.5);
				border: 1px solid #16a34a;
			}
			.history-item .info {
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}
			.history-item .icon {
				font-size: 1.5rem;
				color: #4ade80;
			}
			.history-item .name {
				font-weight: bold;
			}
			.history-item .dest {
				font-size: 0.875rem;
				color: #d1d5db;
			}
			.history-item .time-info {
				text-align: right;
			}
			.history-item .time-info .time {
				font-size: 0.875rem;
				font-weight: 600;
				color: #6ee7b7;
			}
			.history-item .time-info .count {
				font-size: 0.75rem;
				color: #9ca3bd;
			}
			.empty-state {
				display: flex;
				align-items: center;
				justify-content: center;
				height: 100%;
				color: #9ca3bd;
				width: 100%;
			}

			.next-patients-section {
				margin-top: 2rem;
			}
			.next-patients-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 1rem;
			}
			.next-patient-item {
				background-color: #374151;
				border-radius: 0.75rem;
				padding: 1rem;
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.next-patient-item .name {
				font-weight: 600;
			}
			.next-patient-item .dest {
				font-size: 0.875rem;
				color: #d1d5db;
			}
			.next-patient-item .icon {
				color: #38e07b;
			}

			/* Tela de Chamada (Overlay) */
			#calling-overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: #111827;
				display: none; /* Oculto por padrão */
				flex-direction: column;
				justify-content: center;
				align-items: center;
				text-align: center;
				z-index: 100;
			}
			#calling-overlay.visible {
				display: flex;
			}
			#calling-overlay .status {
				font-size: 4.5rem;
				font-weight: bold;
				color: #38e07b;
				margin-bottom: 1rem;
			}
			#calling-overlay .patient-name {
				font-size: 6rem;
				font-weight: 900;
				margin-bottom: 1.5rem;
			}
			#calling-overlay .destination {
				display: inline-flex;
				align-items: center;
				gap: 1rem;
				background-color: #1f2937;
				border-radius: 9999px;
				padding: 1rem 2rem;
			}
			#calling-overlay .destination .icon {
				font-size: 4rem;
				color: #38e07b;
			}
			#calling-overlay .destination .room {
				font-size: 4.5rem;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<!-- Player de mídia invisível para tocar os sons -->
		<cast-media-player style="display: none"></cast-media-player>

		<!-- Tela de Chamada Ativa (Overlay) -->
		<div id="calling-overlay">
			<h2 class="status">Chamando</h2>
			<p id="calling-patient-name" class="patient-name">Nome do Paciente</p>
			<div class="destination">
				<span class="material-symbols-outlined icon">meeting_room</span>
				<p id="calling-destination" class="room">Destino</p>
			</div>
		</div>

		<!-- Layout Principal da Tela -->
		<div class="container">
			<header>
				<div class="logo">
					<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
						<path
							d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z"
							fill="currentColor"
						></path>
					</svg>
					<h1>PSF Maria Lucia da Silva</h1>
				</div>
			</header>
			<main>
				<div class="content-grid">
					<!-- Card Principal -->
					<div class="main-call-card">
						<h2 id="main-status" class="status">Aguardando chamada</h2>
						<p id="main-patient-name" class="patient-name">-</p>
						<div class="destination">
							<span class="material-symbols-outlined icon">meeting_room</span>
							<p id="main-destination" class="room">-</p>
						</div>
					</div>
					<!-- Histórico -->
					<aside class="sidebar">
						<h3>Histórico de Chamadas</h3>
						<div id="history-list" class="history-list">
							<div class="empty-state">
								<p>Nenhuma chamada registrada.</p>
							</div>
						</div>
					</aside>
				</div>
				<!-- Próximos Pacientes -->
				<section class="next-patients-section">
					<h3>Próximos pacientes</h3>
					<div id="next-patients-grid" class="next-patients-grid">
						<p class="empty-state">Não há pacientes na fila de espera.</p>
					</div>
				</section>
			</main>
		</div>

		<script>
			const context = cast.framework.CastReceiverContext.getInstance();
			const playerManager = context.getPlayerManager();
			const CUSTOM_NAMESPACE = 'urn:x-cast:com.example.healthcall';

			// Elementos da UI
			const callingOverlay = document.getElementById('calling-overlay');
			const callingPatientName = document.getElementById('calling-patient-name');
			const callingDestination = document.getElementById('calling-destination');

			const mainStatus = document.getElementById('main-status');
			const mainPatientName = document.getElementById('main-patient-name');
			const mainDestination = document.getElementById('main-destination');
			const historyList = document.getElementById('history-list');
			const nextPatientsGrid = document.getElementById('next-patients-grid');

			const updateUI = (state) => {
				const { calledPatient, nextPatients, callHistory } = state;

				// Atualiza o card principal
				if (calledPatient) {
					mainStatus.textContent = 'Chamado';
					mainPatientName.textContent = calledPatient.name;
					mainDestination.textContent = calledPatient.destination;
				} else {
					mainStatus.textContent = 'Aguardando chamada';
					mainPatientName.textContent = '-';
					mainDestination.textContent = '-';
				}

				// Atualiza o histórico
				historyList.innerHTML = '';
				if (callHistory && callHistory.length > 0) {
					callHistory.slice(0, 5).forEach((rec, idx) => {
						const item = document.createElement('div');
						item.className = `history-item ${idx === 0 ? 'current' : ''}`;
						item.innerHTML = `
							<div class="info">
								<span class="material-symbols-outlined icon">${idx === 0 ? 'campaign' : 'history'}</span>
								<div>
									<p class="name">${rec.name}</p>
									<p class="dest">${rec.destination}</p>
								</div>
							</div>
							<div class="time-info">
								<p class="time">${new Date(rec.calledAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
								<p class="count">${rec.callCount}ª chamada</p>
							</div>
						`;
						historyList.appendChild(item);
					});
				} else {
					historyList.innerHTML = '<div class="empty-state"><p>Nenhuma chamada registrada.</p></div>';
				}

				// Atualiza os próximos pacientes
				nextPatientsGrid.innerHTML = '';
				if (nextPatients && nextPatients.length > 0) {
					nextPatientsGrid.innerHTML = ''; // Limpa o estado de "não há pacientes"
					nextPatients.slice(0, 3).forEach((p) => {
						const item = document.createElement('div');
						item.className = 'next-patient-item';
						item.innerHTML = `
							<div>
								<p class="name">${p.name}</p>
								<p class="dest">${p.destination}</p>
							</div>
							<span class="material-symbols-outlined icon">chevron_right</span>
						`;
						nextPatientsGrid.appendChild(item);
					});
				} else {
					nextPatientsGrid.innerHTML = '<p class="empty-state">Não há pacientes na fila de espera.</p>';
				}
			};

			const showCallingScreen = (patient) => {
				callingPatientName.textContent = patient.name;
				callingDestination.textContent = patient.destination;
				callingOverlay.classList.add('visible');

				// Esconde a tela de chamada após alguns segundos
				setTimeout(() => {
					callingOverlay.classList.remove('visible');
				}, 7000); // Mostra por 7 segundos
			};

			context.addCustomMessageListener(CUSTOM_NAMESPACE, (event) => {
				const { type, payload } = event.data;

				if (type === 'UPDATE_STATE') {
					updateUI(payload);
				} else if (type === 'CALL_PATIENT') {
					// Toca o áudio
					const bellSound = new cast.framework.messages.MediaInformation();
					bellSound.contentUrl = payload.bell;
					bellSound.contentType = 'audio/mp3';

					const speechSound = new cast.framework.messages.MediaInformation();
					speechSound.contentUrl = payload.speech;
					speechSound.contentType = 'audio/mpeg';

					const bellRequest = new cast.framework.messages.LoadRequest(bellSound);

					playerManager.load(bellRequest).then(() => {
						const speechQueueItem = new cast.framework.messages.QueueItem(speechSound);
						playerManager.getQueueManager().insertItems([speechQueueItem]);
					});

					// Mostra a tela de chamada e atualiza a UI principal
					showCallingScreen(payload.patient);
					updateUI(payload); // O payload já contém o estado completo
				}
			});

			context.start({
				// Opções de inicialização, se necessário
			});
		</script>
	</body>
</html>
